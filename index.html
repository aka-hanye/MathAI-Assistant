<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb"><title>数学 AI 助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']],processEscapes:true},svg:{fontCache:'global'}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:820px;margin:auto;min-height:100dvh;background:#fff;display:flex;flex-direction:column}.head{background:#2563eb;color:white;padding:18px}.head h1{font-size:21px;margin:0 0 5px}.head p{margin:0;font-size:13px;opacity:.9}.keybox{padding:12px 15px;border-bottom:1px solid #e5eaf2;display:flex;gap:8px;align-items:center}.keybox input{flex:1;min-width:0;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.keybox button,.upload{border:0;border-radius:9px;padding:10px;background:#eaf0ff;color:#1746a2;font-weight:600}.hint{font-size:12px;color:#64748b;padding:0 15px 10px}.chat{flex:1;padding:15px;overflow:auto}.welcome,.answer{background:#f5f8ff;border-radius:13px;padding:14px;line-height:1.7}.msg{margin:12px 0;max-width:92%;padding:11px 13px;border-radius:13px;line-height:1.65;overflow-wrap:anywhere}.user{margin-left:auto;background:#e8f0ff;white-space:pre-wrap}.assistant{background:#f7f8fa;border:1px solid #e5eaf2}.assistant img{max-width:100%}.assistant pre{overflow:auto;background:#172033;color:white;padding:12px;border-radius:8px}.assistant table{border-collapse:collapse;display:block;overflow:auto}.assistant td,.assistant th{border:1px solid #cbd5e1;padding:6px}.composer{border-top:1px solid #e5eaf2;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}.preview{display:flex;align-items:center;gap:10px;margin-bottom:8px}.preview img{width:75px;height:60px;object-fit:cover;border-radius:8px}.preview button{border:0;background:#fee2e2;color:#991b1b;padding:8px;border-radius:8px}.entry{display:flex;gap:8px;align-items:flex-end}.entry textarea{flex:1;min-height:48px;max-height:150px;resize:vertical;border:1px solid #cbd5e1;border-radius:11px;padding:11px;font:inherit}.send{background:#2563eb;color:white;border:0;border-radius:10px;padding:13px 18px;font-weight:700}.send:disabled{opacity:.5}.tools{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}.upload{display:inline-block;cursor:pointer}.status{font-size:12px;color:#64748b;margin-top:8px}.hidden{display:none!important}.assistant code{background:#e9edf4;padding:2px 4px;border-radius:4px}@media(min-width:700px){.app{margin:18px auto;min-height:calc(100dvh - 36px);border-radius:16px;overflow:hidden;box-shadow:0 8px 32px #10204012}}
</style></head>
<body><main class="app">
<header class="head"><h1>📐 数学 AI 助手</h1><p>上传题目照片 · 中文分步讲解 · LaTeX 数学公式</p></header>
<div class="keybox"><b>API Key</b><input id="key" type="password" placeholder="粘贴 OpenRouter API Key"><button id="save">临时保存</button></div>
<div class="hint">密钥只保存在当前浏览器会话，不会写入仓库。免费模型有调用额度限制。</div>
<section class="chat" id="chat"><div class="welcome"><b>你好！我是数学解题助手。</b><br>输入题目或上传照片，我会先识别题意，再给出解题思路、逐步计算、最终答案和易错点。<br><br>请先填入 API Key。公式会自动排版显示。</div></section>
<div class="composer"><div class="preview hidden" id="preview"><img id="thumb"><span id="fname"></span><button id="remove">移除</button></div>
<div class="entry"><textarea id="question" placeholder="输入数学题，按 Enter 发送，Shift+Enter 换行"></textarea><button class="send" id="send">发送</button></div>
<div class="tools"><label class="upload" for="photo">📷 上传题目图片</label><input class="hidden" id="photo" type="file" accept="image/*"><span class="hint">支持 JPG、PNG、WebP，图片不超过 10MB</span></div><div class="status" id="status"></div></div>
</main>
<script>
const el=id=>document.getElementById(id);let photoData=null,photoName='';
el('key').value=sessionStorage.getItem('mathai_openrouter_key')||'';
el('save').onclick=()=>{sessionStorage.setItem('mathai_openrouter_key',el('key').value.trim());el('status').textContent='已临时保存密钥。'};
el('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024){el('status').textContent='图片超过 10MB，请压缩后重试。';return;}const reader=new FileReader();reader.onload=()=>{photoData=reader.result;photoName=f.name;el('thumb').src=photoData;el('fname').textContent=photoName;el('preview').classList.remove('hidden');};reader.readAsDataURL(f);};
el('remove').onclick=()=>{photoData=null;photoName='';el('photo').value='';el('preview').classList.add('hidden');};
function add(text,role){const d=document.createElement('div');d.className='msg '+role;if(role==='assistant'){d.innerHTML=DOMPurify.sanitize(marked.parse(text));el('chat').append(d);if(window.MathJax?.typesetPromise)MathJax.typesetPromise([d]);}else{d.textContent=text;el('chat').append(d);}el('chat').scrollTop=el('chat').scrollHeight;return d;}
el('send').onclick=async()=>{const key=el('key').value.trim(),q=el('question').value.trim();if(!key){el('status').textContent='请先填写 OpenRouter API Key。';el('key').focus();return;}if(!q&&!photoData){el('status').textContent='请输入题目或上传图片。';return;}
add((q||'请识别并解答图片中的数学题。')+(photoName?' [图片：'+photoName+']':''),'user');el('question').value='';
const parts=[{type:'text',text:'请用简体中文解答数学题。先准确识别题目，再给出题意分析、解题思路、逐步计算、最终答案和易错点。公式使用 LaTeX，行内用 $...$，独立公式用 $$...$$。不要跳过关键步骤；若图片模糊或题意不清，先说明。\n'+(q||'请解答图片中的题目。')}];if(photoData)parts.push({type:'image_url',image_url:{url:photoData}});
const pending=add('正在识别题目并生成解答，请稍候……','assistant');el('send').disabled=true;el('status').textContent='正在连接免费模型……';
try{const response=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json','HTTP-Referer':location.href,'X-Title':'MathAI Assistant'},body:JSON.stringify({model:'openrouter/free',messages:[{role:'system',content:'你是一位严谨耐心的中文数学教师。优先保证答案正确，分步推导，清楚区分条件、过程和结论。若无法辨认图片内容，不要猜测。'},{role:'user',content:parts}],temperature:0.2})});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||'HTTP '+response.status);const answer=data.choices?.[0]?.message?.content;if(!answer)throw new Error('模型没有返回内容');pending.remove();add(answer,'assistant');el('status').textContent='回答完成。';}
catch(err){pending.remove();add('请求失败：'+err.message+'\n请检查 API Key、网络或稍后重试。','assistant');el('status').textContent='请求失败。';}
finally{el('send').disabled=false;}
};
el('question').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el('send').click();}};
</script></body></html>
